<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style>
        #myCarousel {
            margin: 8px;
            border: 1px solid #ddd;
        }

        .carousel-inner .item {
            height: 280px;
            background-color: #555;
        }

        .slide-content {
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #333;
        }

        .carousel-control {
            background-image: none !important;
            opacity: 1;
        }

        .carousel-control .glyphicon {
            color: #ccc;
            text-shadow: none;
        }
    </style>
</head>
<body>

   <div id="myCarousel" class="carousel slide">

        <div class="carousel-inner">

            <div class="item first-slide">
                <div class="slide-content">First slide</div>
            </div>

            <div class="item second-slide">
                <div class="slide-content">Second slide</div>
            </div>

            <div class="item third-slide active">
                <div class="slide-content">Third slide</div>
            </div>

            <div class="item fourth-slide">
                <div class="slide-content">Fourth slide</div>
            </div>

            <div class="item fifth-slide">
                <div class="slide-content">Fifth slide</div>
            </div>

        </div>

        <a class="left carousel-control" href="#myCarousel" data-slide="prev">
            <span class="glyphicon glyphicon-chevron-left"></span>
            <span class="sr-only">Previous</span>
        </a>

        <a class="right carousel-control" href="#myCarousel" data-slide="next">
            <span class="glyphicon glyphicon-chevron-right"></span>
            <span class="sr-only">Next</span>
        </a>

    </div>

    <!-- Required JavaScript libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- Initialize carousel -->
  </body>
</html>
